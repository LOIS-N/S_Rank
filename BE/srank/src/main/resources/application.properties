spring.application.name=srank
spring.config.import=optional:file:.env[.properties]

# Swagger server url
app.server.url=${SERVER_URL}

#
## JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
#
## PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#
## GMS OPENAI
openai.base-url=${OPENAI_BASE_URL}
openai.api-key=${OPENAI_API_KEY}
#

# Redis - dev
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

#
## RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
#
## OAuth2
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.google.scope=email,profile
#
## JWT
#jwt.secret=${JWT_SECRET}
#jwt.access-expiration=3600000
#jwt.refresh-expiration=604800000
#
## Privy
app.privy.app-id=${PRIVY_APP_ID:}
app.privy.issuer=${PRIVY_ISSUER:privy.io}
app.privy.verification-key=${PRIVY_VERIFICATION_KEY:}
#
## Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
# 
## Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.srank.auth.filter.duration=true
management.metrics.distribution.percentiles-histogram.srank.auth.login.duration=true
management.metrics.distribution.percentiles-histogram.srank.auth.token.validation.duration=true
management.metrics.distribution.percentiles-histogram.srank.gacha.draw.duration=true
management.metrics.distribution.percentiles-histogram.srank.synthesis.duration=true
management.metrics.distribution.percentiles-histogram.srank.enhancement.duration=true
management.metrics.distribution.percentiles-histogram.srank.quest.duration=true
management.metrics.distribution.percentiles-histogram.srank.openai.request.duration=true
management.metrics.distribution.percentiles-histogram.srank.subquest.scheduler.duration=true
management.metrics.distribution.percentiles-histogram.srank.sse.send.duration=true
management.metrics.distribution.percentiles-histogram.srank.user.operation.duration=true
management.metrics.distribution.percentiles-histogram.srank.card.delete.duration=true
management.metrics.distribution.percentiles-histogram.srank.desk.unlock.duration=true
management.metrics.distribution.percentiles-histogram.srank.rabbitmq.publish.duration=true
management.metrics.distribution.percentiles-histogram.srank.rabbitmq.consume.duration=true
management.metrics.distribution.percentiles-histogram.srank.blockchain.dispatch.duration=true
management.metrics.distribution.percentiles-histogram.srank.blockchain.write.duration=true
management.metrics.distribution.percentiles-histogram.srank.ranking.projection.duration=true
management.metrics.distribution.percentiles-histogram.ranking.batch.job.duration=true
management.metrics.distribution.percentiles-histogram.ranking.batch.step.duration=true
management.metrics.distribution.percentiles-histogram.ranking.batch.phase.duration=true
