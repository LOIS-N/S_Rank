spring.application.name=srank
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.password=${REDIS_PASSWORD}

#spring.rabbitmq.host=${RABBITMQ_HOST}
#spring.rabbitmq.port=${RABBITMQ_PORT}
#spring.rabbitmq.username=${RABBITMQ_USERNAME}
#spring.rabbitmq.password=${RABBITMQ_PASSWORD}

app.auth.jwt.secret=${JWT_SECRET:01234567890123456789012345678901}
app.auth.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:3600}
app.auth.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
app.auth.jwt.signup-expiration-seconds=${JWT_SIGNUP_EXPIRATION_SECONDS:1800}
app.auth.refresh-cookie-name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.google-userinfo-uri=${GOOGLE_USERINFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
app.game.initial-gold=${APP_INITIAL_GOLD:10000}
app.game.initial-coin=${APP_INITIAL_COIN:30}

