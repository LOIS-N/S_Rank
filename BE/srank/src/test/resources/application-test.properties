spring.config.import=
spring.datasource.url=jdbc:h2:mem:srank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
app.ranking.batch.runner-enabled=false
app.server.url=http://localhost
openai.base-url=http://localhost
openai.api-key=test-key
app.privy.app-id=test-app
app.privy.issuer=test-issuer
app.privy.verification-key=test-key
