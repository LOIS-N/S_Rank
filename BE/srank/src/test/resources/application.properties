spring.datasource.url=jdbc:h2:mem:srank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
app.auth.jwt.secret=01234567890123456789012345678901
app.auth.jwt.access-expiration-seconds=3600
app.auth.jwt.refresh-expiration-seconds=1209600
app.auth.jwt.signup-expiration-seconds=1800
app.auth.refresh-cookie-name=refresh_token
app.auth.refresh-cookie-secure=false
app.auth.google-userinfo-uri=https://www.googleapis.com/oauth2/v3/userinfo
app.game.initial-gold=10000
app.game.initial-coin=30
