resolver 127.0.0.11 valid=30s;

# HTTP → HTTPS 리다이렉트 (prod)
server {
    listen 80;
    server_name j14e204.p.ssafy.io;
    return 301 https://$host$request_uri;
}

# Dev HTTP (8080)
server {
    listen 8080;
    server_name j14e204.p.ssafy.io;

    location /api/ {
        set $backend "dev-be";
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /swagger-ui/ {
        set $backend "dev-be";
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        set $backend "dev-be";
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        set $frontend "dev-fe";
        proxy_pass http://$frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Dev HTTPS (8001)
server {
    listen 8001 ssl;
    server_name j14e204.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/j14e204.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j14e204.p.ssafy.io/privkey.pem;

    location /api/ {
        set $backend "dev-be";
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /swagger-ui/ {
        set $backend "dev-be";
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        set $backend "dev-be";
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        alias /home/ubuntu/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $frontend "dev-fe";
        proxy_pass http://$frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Jenkins HTTPS (8090)
server {
    listen 8090 ssl;
    server_name j14e204.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/j14e204.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j14e204.p.ssafy.io/privkey.pem;

    location / {
        set $jenkins "jenkins";
        proxy_pass http://$jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

