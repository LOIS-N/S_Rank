version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    user: root
    environment:
      - JAVA_OPTS=-Xmx3g -Xms512m
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/libexec/docker/cli-plugins:/usr/local/lib/docker/cli-plugins
      - /home/ubuntu/cicd:/home/ubuntu/cicd
    networks:
      - gateway-net

volumes:
  jenkins-data:
    name: jenkins-data

networks:
  gateway-net:
    external: true
