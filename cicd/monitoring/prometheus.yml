global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'dev-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['dev-be:8080']

  - job_name: 'prod-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['prod-be:8080']
